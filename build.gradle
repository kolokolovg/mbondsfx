plugins {
    id 'application'
    id 'jacoco'
    id 'org.cyclonedx.bom' version '3.5.1'
}

group = 'ru.onlychill'
version = '1.0-SNAPSHOT'

ext.junitVersion = '5.12.2'
ext.slf4jVersion = '2.0.20'

// Conservative JaCoCo minimums (COVEREDRATIO) per subproject, a few points below the measured actuals,
// enforced by jacocoTestCoverageVerification wired into `check`. Root is not listed: its production code is
// exercised by out-of-process module-path subprocesses that JaCoCo does not instrument.
def coverageThresholds = [
        ':core'                : [line: 0.93, branch: 0.82,
                                  packages: ['ru.onlychill.mbondsfx.core.ledger': [line: 0.90, branch: 0.77]]],
        ':application'         : [line: 0.88, branch: 0.74, packages: [:]],
        ':integrations'        : [line: 0.84, branch: 0.75, packages: [:]],
        ':integrations-moex'   : [line: 0.85, branch: 0.72, packages: [:]],
        ':integrations-cbr'    : [line: 0.87, branch: 0.68, packages: [:]],
        ':persistence-memory'  : [line: 0.86, branch: 0.71, packages: [:]],
]

def aggregateCoverageReport = tasks.register('jacocoAggregateReport',
        org.gradle.testing.jacoco.tasks.JacocoReport) {
    group = 'verification'
    description = 'Generates an aggregate JaCoCo report for all project Java production sources.'
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

allprojects {
    repositories {
        mavenCentral()
    }

    def javaProject = it
    javaProject.plugins.withId('java') {
        javaProject.pluginManager.apply('jacoco')
        javaProject.jacoco.toolVersion = '0.8.15'

        def testTask = javaProject.tasks.named('test', Test)
        def reportTask = javaProject.tasks.named('jacocoTestReport',
                org.gradle.testing.jacoco.tasks.JacocoReport)
        testTask.configure {
            modularity.inferModulePath = false
            finalizedBy(reportTask)
        }
        reportTask.configure {
            dependsOn(testTask)
            reports {
                html.required = true
                xml.required = true
                csv.required = false
            }
        }

        def thresholds = coverageThresholds[javaProject.path]
        if (thresholds != null) {
            def verificationTask = javaProject.tasks.named('jacocoTestCoverageVerification',
                    org.gradle.testing.jacoco.tasks.JacocoCoverageVerification)
            verificationTask.configure {
                dependsOn(testTask)
                violationRules {
                    rule {
                        limit {
                            counter = 'LINE'
                            value = 'COVEREDRATIO'
                            minimum = thresholds.line
                        }
                        limit {
                            counter = 'BRANCH'
                            value = 'COVEREDRATIO'
                            minimum = thresholds.branch
                        }
                    }
                    thresholds.packages.each { packageName, minimums ->
                        rule {
                            element = 'PACKAGE'
                            includes = [packageName]
                            limit {
                                counter = 'LINE'
                                value = 'COVEREDRATIO'
                                minimum = minimums.line
                            }
                            limit {
                                counter = 'BRANCH'
                                value = 'COVEREDRATIO'
                                minimum = minimums.branch
                            }
                        }
                    }
                }
            }
            javaProject.tasks.named('check') {
                dependsOn(verificationTask)
            }
        }

        aggregateCoverageReport.configure {
            dependsOn(testTask)
            executionData.from(javaProject.layout.buildDirectory.file('jacoco/test.exec'))
            sourceDirectories.from(javaProject.sourceSets.main.allJava.srcDirs)
            classDirectories.from(javaProject.sourceSets.main.output.classesDirs)
        }
    }
}

subprojects {
    plugins.withId('java') {
        dependencies {
            testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
            constraints {
                testImplementation("org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}") {
                    because 'Keep transitive test SLF4J aligned with the root runtime version.'
                }
            }
        }
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    modularity.inferModulePath = true
}

application {
    mainModule = 'ru.onlychill.mbondsfx'
    mainClass = 'ru.onlychill.mbondsfx.Main'
}

distributions {
    main {
        contents {
            from('LICENSE', 'NOTICE')
            from('licenses') { into 'licenses' }
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':application')
    implementation project(':integrations')
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly project(':integrations-moex')
    runtimeOnly project(':integrations-cbr')
    runtimeOnly project(':persistence-memory')
    runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = false
}

tasks.named('run', JavaExec) {
    modularity.inferModulePath = true
}

def installDistribution = tasks.named('installDist')
tasks.named('test', Test) {
    description = 'Runs JUnit tests, including module-path and installed-distribution contracts.'
    useJUnitPlatform()
    dependsOn installDistribution
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    doFirst {
        systemProperty 'projectRoot', rootProject.projectDir.absolutePath
        systemProperty 'installDir', installDistribution.get().destinationDir.absolutePath
    }
}

// SBOM (CycloneDX 1.6, JSON+XML) для CI/SCA: ./gradlew cyclonedxBom -> build/reports/cyclonedx/
// Только runtime-зависимости дистрибутива; тестовые библиотеки в SBOM не попадают.
cyclonedxBom {
    projectType = 'application'
    schemaVersion = org.cyclonedx.Version.VERSION_16
}

// Production-SBOM: исключаем тестовые и coverage-конфигурации из направлений зависимостей.
allprojects {
    tasks.matching { it.name == 'cyclonedxDirectBom' }.configureEach {
        includeConfigs = ['runtimeClasspath']
    }
}
