name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # еженедельный повторный скан: новые CVE появляются без изменений кода

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, tests, coverage, module-path suite
        run: ./gradlew clean build jacocoAggregateReport --no-daemon
      - name: SBOM (CycloneDX)
        run: ./gradlew cyclonedxBom --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/cyclonedx/
            build/reports/jacoco/jacocoAggregateReport/
            **/build/reports/tests/test/
          if-no-files-found: warn

  vulnerability-scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate SBOM
        run: ./gradlew cyclonedxBom --no-daemon
      - name: OSV-Scanner on SBOM (fails on known vulnerabilities)
        run: |
          docker run --rm -v "$PWD/build/reports/cyclonedx:/sbom:ro" \
            ghcr.io/google/osv-scanner:latest scan source --sbom=/sbom/bom.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
