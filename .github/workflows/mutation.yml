name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 6' # еженедельный PIT-прогон для :core; не merge gate и не часть check

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: PIT mutation testing (:core, fails below mutationThreshold from core/build.gradle)
        run: ./gradlew :core:pitest --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pitest-reports
          path: core/build/reports/pitest/
          if-no-files-found: warn
