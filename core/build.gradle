plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    modularity.inferModulePath = true
}

def contractTestRunners = [
    foundationContractTest: 'ru.onlychill.mbondsfx.core.FoundationContractTests',
    domainContractTest: 'ru.onlychill.mbondsfx.core.DomainContractTests',
    ledgerContractTest: 'ru.onlychill.mbondsfx.core.LedgerContractTests',
    architectureContractTest: 'ru.onlychill.mbondsfx.core.ArchitectureContractTests'
]

contractTestRunners.each { taskName, runnerClass ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs the ${taskName} contract runner."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = runnerClass
        modularity.inferModulePath = false
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        if (taskName == 'architectureContractTest') {
            systemProperty 'coreMainSourceDir', project.layout.projectDirectory.dir('src/main/java').asFile.absolutePath
        }
    }
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = false
}

check {
    dependsOn contractTestRunners.keySet()
}

// These dependency-free suites have main methods, not JUnit test methods.
tasks.named('test') {
    enabled = false
    dependsOn contractTestRunners.keySet()
}
