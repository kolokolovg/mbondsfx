plugins {
    id 'java-library'
    // PIT mutation testing: build/test tooling only, not wired into `check`; see docs/plans/verification.md.
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = rootProject.group
version = rootProject.version

dependencies {
    testImplementation 'net.jqwik:jqwik-api:1.9.2'
    testRuntimeOnly 'net.jqwik:jqwik-engine:1.9.2'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    modularity.inferModulePath = true
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = false
}

tasks.named('test', Test) {
    systemProperty 'coreMainSourceDir', project.layout.projectDirectory.dir('src/main/java').asFile.absolutePath
    systemProperty 'coreMainClassesDirs', project.sourceSets.main.output.classesDirs.asPath
    systemProperty 'jqwik.database', project.layout.buildDirectory.file('jqwik-database').get().asFile.absolutePath
}

// PIT (mutation testing), build/test-only. Run manually: ./gradlew :core:pitest
// Not part of `check`. mutationThreshold fails only the pitest task and the weekly workflow.
// Measured 594/607 (97.86%) after removing redundant guards (Ledger link checks, buy/sell other-commission checks).
// PIT's gate compares the score rounded to a whole percent (HALF_UP), so 97.86% shows as 98%; 97 does not exceed
// the measured score. The gate fails at 585 killed or fewer. The 13 undetected mutants are equivalent, each classified
// in docs/plans/verification.md.
// No excludedMethods/avoidCallsTo: a method-level exclusion would also hide killable mutants of the same methods.
pitest {
    pitestVersion = '1.30.1'
    junit5PluginVersion = '1.2.3'
    mutationThreshold = 97
    targetClasses = [
            'ru.onlychill.mbondsfx.core.ledger.*',
            'ru.onlychill.mbondsfx.core.money.*',
            'ru.onlychill.mbondsfx.core.bond.*',
            'ru.onlychill.mbondsfx.core.bond.calculation.*',
    ]
    targetTests = ['ru.onlychill.mbondsfx.core.*']
    // ArchUnit/bytecode guards read Gradle-provided system properties and are structural, not behavioral.
    excludedTestClasses = ['*ArchitectureContractTests', '*BytecodeArchitectureContractTests']
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    reportDir = project.layout.buildDirectory.dir('reports/pitest').get().asFile
    // Separate jqwik database for PIT forks; removed by `clean`, never versioned.
    jvmArgs = ["-Djqwik.database=${project.layout.buildDirectory.dir('pitest/jqwik-database').get().asFile.absolutePath}"]
}

// jqwik does not create the parent directory of its database file; without it the engine fails under PIT.
tasks.named('pitest') {
    doFirst {
        project.layout.buildDirectory.dir('pitest').get().asFile.mkdirs()
    }
}
