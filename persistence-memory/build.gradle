plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    modularity.inferModulePath = true
}

dependencies {
    implementation project(':application')
}

def contractTestRunners = [
    persistenceMemoryContractTest: 'ru.onlychill.mbondsfx.persistence.memory.PersistenceMemoryContractTests'
]

contractTestRunners.each { taskName, runnerClass ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs the ${taskName} contract runner."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = runnerClass
        modularity.inferModulePath = false
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = false
}

check {
    dependsOn contractTestRunners.keySet()
}

// This dependency-free suite has a main method, not JUnit test methods.
tasks.named('test') {
    enabled = false
    dependsOn contractTestRunners.keySet()
}
